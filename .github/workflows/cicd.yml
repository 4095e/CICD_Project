name: CI/CD Pipeline for Node.js App

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build
        run: npm run build

      - name: Deploy to server
        env:
          DEPLOY_KEY_BASE64: ${{ secrets.DEPLOY_KEY_BASE64 }}
        run: |
          # Decode the base64 key and write to file with proper formatting
          echo "$DEPLOY_KEY_BASE64" | base64 -d > deploy_key
          echo "" >> deploy_key  # Ensure proper line ending
          chmod 600 deploy_key

          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i deploy_key azureuser@172.171.212.14 "echo 'SSH connection successful'"

          # Deploy files to server
          echo "Deploying files..."
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i deploy_key -r ./build azureuser@172.171.212.14:/var/www/app/

          # Verify deployment
          echo "Verifying deployment..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i deploy_key azureuser@172.171.212.14 "ls -la /var/www/app/build && echo 'Deployment successful'"

          # Clean up the SSH key
          rm -f deploy_key
          echo "Deployment completed successfully!"
