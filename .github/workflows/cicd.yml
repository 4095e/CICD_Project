name: CI/CD Pipeline for Node.js App

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          
      - name: Build
        run: npm run build
        
      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key
          
          # Copy application files to VM
          scp -o StrictHostKeyChecking=no -i deploy_key package.json azureuser@52.170.210.111:/var/www/app/
          scp -o StrictHostKeyChecking=no -i deploy_key index.js azureuser@52.170.210.111:/var/www/app/
          
          # Install dependencies and restart app on VM
          ssh -o StrictHostKeyChecking=no -i deploy_key azureuser@52.170.210.111 << 'ENDSSH'
            cd /var/www/app
            npm install
            pkill -f "node index.js" || true
            nohup npm start > app.log 2>&1 &
            echo "Application deployed and started"
ENDSSH
          
          rm deploy_key
