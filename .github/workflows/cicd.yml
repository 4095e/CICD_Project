      - name: Deploy to server
        env:
          DEPLOY_KEY_BASE64: ${{ secrets.DEPLOY_KEY_BASE64 }}
        run: |
          # Decode the base64 key and write to file
          echo "$DEPLOY_KEY_BASE64" | base64 -d > deploy_key
          chmod 600 deploy_key

          # Debug: check the key file
          ls -l deploy_key
          file deploy_key
          echo "First line of key:"
          head -n 1 deploy_key
          echo "Last line of key:"
          tail -n 1 deploy_key

          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i deploy_key azureuser@172.171.212.14 "echo 'SSH connection successful'"

          # Deploy files
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i deploy_key -r ./build azureuser@172.171.212.14:/var/www/app/

          # Verify deployment
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i deploy_key azureuser@172.171.212.14 "ls -la /var/www/app/build && echo 'Deployment successful'"

          # Clean up
          rm -f deploy_key
